name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install create-dmg
        run: npm install -g create-dmg

      - name: Build app bundle
        run: cargo tauri build --target aarch64-apple-darwin --bundles app

      - name: Create DMG
        run: |
          create-dmg --no-code-sign --no-version-in-filename \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/emdee.app" .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: emdee.dmg

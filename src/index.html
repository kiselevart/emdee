<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>emdee</title>
  <link rel="stylesheet" href="style.css" />
  <script src="marked.min.js"></script>
</head>
<body>
  <div id="toolbar">
    <div id="file-info">
      <span id="filename">untitled.md</span>
      <span id="unsaved-dot" class="hidden">●</span>
      <span id="save-status" class="hidden">Saved</span>
    </div>
    <div id="toolbar-actions">
      <button id="btn-open">Open</button>
      <button id="btn-save">Save</button>
      <button id="btn-toggle">Edit</button>
      <button id="btn-theme" title="Toggle theme">☀</button>
    </div>
  </div>

  <div id="tab-bar"></div>

  <div id="editor-container">
    <div id="editor" class="hidden" contenteditable="true" spellcheck="true" data-placeholder="Start writing..."></div>
    <div id="preview"></div>
  </div>

  <div id="word-count"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
